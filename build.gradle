plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.3.31'
}

group = 'com.autoharvester'
version = '1.0.0'
archivesBaseName = 'AutoCropHarvester'

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

minecraft {
    mcVersion = '1.8.9'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '22'
}

repositories {
    maven { url 'https://maven.minecraftforge.net' }
    maven { url 'https://maven.minecraftforge.net/legacy' }
    mavenCentral()
}

dependencies {
    implementation rfg.deobf('net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9:universal')
}

jar {
    manifest {
        attributes('FMLCorePluginContainsFMLMod': 'true')
    }
}
