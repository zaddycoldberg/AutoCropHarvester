buildscript {
    repositories {
        maven { url "https://maven.minecraftforge.net" }
        maven { url "https://maven.minecraftforge.net/legacy" }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'java'

group = 'com.autoharvester'
version = '1.0.0'
archivesBaseName = 'AutoCropHarvester'

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}

repositories {
    mavenLocal()
    maven { url 'https://maven.minecraftforge.net' }
    maven { url 'https://libraries.minecraft.net' }
    mavenCentral()
}

jar {
    manifest {
        attributes 'FMLCorePluginContainsFMLMod': 'true'
    }
}

// ForgeGradle CI workaround: directly add ALL forge jars to compile classpath
afterEvaluate {
    def forgeVer = '1.8.9-11.15.1.2318-1.8.9'
    def mcForgeCache = new File("${System.getProperty('user.home')}/.gradle/caches/minecraft/net/minecraftforge/forge/${forgeVer}")

    // Main deobfuscated MC+Forge jar
    def forgeBin = new File(mcForgeCache, "stable/22/forgeBin-${forgeVer}.jar")
    if (forgeBin.exists()) {
        logger.lifecycle("CI fix: Adding forgeBin: ${forgeBin}")
        compileJava.classpath += project.files(forgeBin)
    }

    // FML and Forge-added classes (not patched into MC, but added by Forge)
    def userdevClasses = new File(mcForgeCache, "userdev/classes.jar")
    if (userdevClasses.exists()) {
        logger.lifecycle("CI fix: Adding userdev classes: ${userdevClasses}")
        compileJava.classpath += project.files(userdevClasses)
    }

    // Also add all jars in the userdev directory
    def userdevDir = new File(mcForgeCache, "userdev")
    if (userdevDir.exists()) {
        userdevDir.listFiles().findAll { it.name.endsWith(".jar") }.each { jar ->
            logger.lifecycle("CI fix: Adding userdev jar: ${jar}")
            compileJava.classpath += project.files(jar)
        }
    }
}
