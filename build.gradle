buildscript {
    repositories {
        maven { url "https://maven.minecraftforge.net" }
        maven { url "https://maven.minecraftforge.net/legacy" }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'java'

group = 'com.autoharvester'
version = '1.0.0'
archivesBaseName = 'AutoCropHarvester'

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}

repositories {
    mavenLocal()
    maven { url 'https://maven.minecraftforge.net' }
    maven { url 'https://libraries.minecraft.net' }
    mavenCentral()
}

jar {
    manifest {
        attributes 'FMLCorePluginContainsFMLMod': 'true'
    }
}

// ForgeGradle CI workaround: directly add forgeBin to compile classpath
afterEvaluate {
    def forgeVer = '1.8.9-11.15.1.2318-1.8.9'
    def forgeBin = new File("${System.getProperty('user.home')}/.gradle/caches/minecraft/net/minecraftforge/forge/${forgeVer}/stable/22/forgeBin-${forgeVer}.jar")
    if (forgeBin.exists()) {
        logger.lifecycle("CI fix: Adding forgeBin to classpath from ${forgeBin}")
        compileJava.classpath += project.files(forgeBin)
    } else {
        logger.warn("CI fix: forgeBin not found at ${forgeBin}")
    }
}
