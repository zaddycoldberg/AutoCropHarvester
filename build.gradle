buildscript {
    repositories {
        maven { url "https://maven.minecraftforge.net" }
        maven { url "https://maven.minecraftforge.net/legacy" }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'java'

group = 'com.autoharvester'
version = '1.0.0'
archivesBaseName = 'AutoCropHarvester'

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}

repositories {
    mavenCentral()
}

dependencies {
    compile fileTree(dir: '/tmp/forge-classpath', include: '*.jar')
}

jar {
    manifest {
        attributes 'FMLCorePluginContainsFMLMod': 'true'
    }
}

// CI workaround: add forgeBin (deobf MC) to classpath
afterEvaluate {
    def forgeVer = '1.8.9-11.15.1.2318-1.8.9'
    def forgeBin = new File("${System.getProperty('user.home')}/.gradle/caches/minecraft/net/minecraftforge/forge/${forgeVer}/stable/22/forgeBin-${forgeVer}.jar")
    if (forgeBin.exists()) {
        logger.lifecycle("CI: Adding forgeBin (${forgeBin.length()} bytes)")
        compileJava.classpath += project.files(forgeBin)
    }
}
