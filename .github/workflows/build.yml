name: Build Forge Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"
      - name: Install Gradle 2.14
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "2.14"
          cache-disabled: true
      - name: Setup Decompile Workspace and Build (single invocation)
        run: |
          gradle setupDecompWorkspace build --no-daemon
        timeout-minutes: 40
      - name: List generated jars
        if: always()
        run: find build/libs -name "*.jar" 2>/dev/null || echo "No jars found"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AutoCropHarvester-JAR
          path: build/libs/*.jar
