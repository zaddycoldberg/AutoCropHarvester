name: Build Forge Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Install Gradle 2.14
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '2.14'
      - name: Setup CI Workspace (downloads and deobfuscates Minecraft+Forge)
        run: gradle setupCIWorkspace --no-daemon
        timeout-minutes: 20
      - name: Publish forgeBin to local Maven repository
        run: |
          FORGE_VERSION="1.8.9-11.15.1.2318-1.8.9"
          FORGEBIN_JAR="$HOME/.gradle/caches/minecraft/net/minecraftforge/forge/${FORGE_VERSION}/stable/22/forgeBin-${FORGE_VERSION}.jar"
          LOCAL_DIR="$HOME/.m2/repository/net/minecraftforge/forgeBin/${FORGE_VERSION}"
          mkdir -p "$LOCAL_DIR"
          cp "$FORGEBIN_JAR" "${LOCAL_DIR}/forgeBin-${FORGE_VERSION}.jar"
          echo "Copied forgeBin to $LOCAL_DIR"
          cat > "${LOCAL_DIR}/forgeBin-${FORGE_VERSION}.pom" << 'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>net.minecraftforge</groupId>
            <artifactId>forgeBin</artifactId>
            <version>1.8.9-11.15.1.2318-1.8.9</version>
            <packaging>jar</packaging>
          </project>
          POMEOF
          echo "Created POM file"
          ls -la "$LOCAL_DIR"
      - name: Build Mod
        run: gradle build --no-daemon
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCropHarvester-JAR
          path: build/libs/*.jar
