name: Build Forge Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Forge workspace
        run: ./gradlew setupDecompWorkspace --no-daemon
        timeout-minutes: 30

      - name: Build JAR
        run: ./gradlew build --no-daemon
        timeout-minutes: 15

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: AutoCropHarvester-JAR
          path: build/libs/*.jar
