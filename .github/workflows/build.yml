name: Build Forge Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Setup Forge
        run: ./gradlew setupDecompWorkspace --no-daemon
        timeout-minutes: 30
      - name: Build
        run: ./gradlew build --no-daemon
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCropHarvester-JAR
          path: build/libs/*.jar
        
