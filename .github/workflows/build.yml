name: Build Forge Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Install Gradle 2.14
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '2.14'
          cache-disabled: true
      - name: Setup Decopm Workspace and Build
        run: gradle setupDecompWorkspace build --no-daemon
        timeout-minutes: 50
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCropHarvester-JAR
          path: build/libs/*.jar
